name: Build Commit

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      build-type:
        required: true
        type: string
      malloc-impl:
        required: true
        type: string
      compiler:
        required: false
        type: string
        default: 'gcc'
      conan-channel:
        required: false
        type: string
        default: 'dev'
      tooling:
        required: true
        type: string

jobs:
  SislDeps:
    uses: ebay/sisl/.github/workflows/build_dependencies.yml@dev/v14.x
    with:
      branch: dev/v14.x
      platform: ${{ inputs.platform }}
      build-type: ${{ inputs.build-type }}
      malloc-impl: ${{ inputs.malloc-impl }}
      compiler: ${{ inputs.compiler }}
      conan-channel: ${{ inputs.conan-channel }}
      tooling: None
    if: ${{ github.event_name != 'pull_request' }}

  CraftClientDeps:
    needs: SislDeps
    if: ${{ always() && (needs.SislDeps.result == 'success' || needs.SislDeps.result == 'skipped') && github.event_name != 'pull_request' }}
    uses: eBay/craft_client/.github/workflows/build_dependencies.yml@dev/v0.x
    with:
      branch: dev/v0.x
      platform: ${{ inputs.platform }}
      build-type: ${{ inputs.build-type }}
      malloc-impl: ${{ inputs.malloc-impl }}
      compiler: ${{ inputs.compiler }}
      conan-channel: ${{ inputs.conan-channel }}
      tooling: None

  NuraftMesgDeps:
    needs: SislDeps
    uses: eBay/nuraft_mesg/.github/workflows/build_dependencies.yml@dev/v5.x
    with:
      branch: dev/v5.x
      platform: ${{ inputs.platform }}
      build-type: ${{ inputs.build-type }}
      malloc-impl: ${{ inputs.malloc-impl }}
      compiler: ${{ inputs.compiler }}
      conan-channel: ${{ inputs.conan-channel }}
      tooling: None
    if: ${{ github.event_name != 'pull_request' }}

  IOMgrDeps:
    needs: SislDeps
    uses: eBay/iomanager/.github/workflows/build_dependencies.yml@dev/v13.x
    with:
      branch: dev/v13.x
      platform: ${{ inputs.platform }}
      build-type: ${{ inputs.build-type }}
      malloc-impl: ${{ inputs.malloc-impl }}
      compiler: ${{ inputs.compiler }}
      conan-channel: ${{ inputs.conan-channel }}
      tooling: None
    if: ${{ github.event_name != 'pull_request' }}

  UblkppDeps:
    needs: CraftClientDeps
    runs-on: ${{ inputs.platform }}
    steps:
      - name: Retrieve UblkPP
        uses: actions/checkout@v4
        with:
          repository: szmyd/ublkpp
          ref: main

      - name: Setup Conan
        uses: ebay/sisl/.github/actions/setup_conan2@dev/v14.x
        with:
          platform: ${{ inputs.platform }}
          compiler: ${{ inputs.compiler }}

      - name: Load UblkPP Cache
        id: restore-cache
        uses: ebay/sisl/.github/actions/load_conan2@dev/v14.x
        with:
          testing: 'False'
          key_prefix: UblkPPDeps-${{ inputs.platform }}-${{ inputs.build-type }}-${{ inputs.malloc-impl }}-${{ inputs.compiler }}

      - name: Load Sisl Cache
        uses: eBay/sisl/.github/actions/load_conan2@dev/v14.x
        with:
          testing: 'False'
          path: import/sisl
          key_prefix: SislDeps14-${{ inputs.platform }}-${{ inputs.build-type }}-${{ inputs.malloc-impl }}-${{ inputs.compiler }}
          fail_on_cache_miss: false

      - name: Retrieve Dependencies
        uses: actions/checkout@v4
        with:
          repository: eBay/sisl
          path: import/sisl
          ref: dev/v14.x

      - name: Retrieve CraftClient
        uses: actions/checkout@v4
        with:
          repository: eBay/craft_client
          path: import/craft_client
          ref: dev/v0.x

      - name: Prepare Recipes
        run: |
          pushd import/sisl
          ./prepare_v2.sh
          conan export --user oss --channel ${{ inputs.conan-channel }} .
          popd
          pushd import/craft_client
          conan export --user oss --channel ${{ inputs.conan-channel }} .
          popd
          ./prepare_v2.sh

      - name: Build Cache
        run: |
          conan install \
              -o sisl/*:malloc_impl=${{ inputs.malloc-impl }} \
              -s:h build_type=${{ inputs.build-type }} \
              -c tools.build:skip_test=True \
              --format=json \
              --build missing \
              . > ~/build.json
          conan list --graph ~/build.json --graph-binaries=build,cache --format=json > ~/pkglist.json
        if: ${{ steps.restore-cache.outputs.cache-hit != 'true' }}

      - name: Save Conan Cache
        uses: ebay/sisl/.github/actions/store_conan2@dev/v14.x
        with:
          key_prefix: UblkPPDeps-${{ inputs.platform }}-${{ inputs.build-type }}-${{ inputs.malloc-impl }}-${{ inputs.compiler }}
        if: ${{ github.event_name != 'pull_request' && steps.restore-cache.outputs.cache-hit != 'true' }}
    if: ${{ github.event_name != 'pull_request' }}

  HomeStoreDeps:
    needs: [IOMgrDeps, NuraftMesgDeps]
    uses: eBay/homestore/.github/workflows/build_dependencies.yml@dev/v8.x
    with:
      branch: dev/v8.x
      platform: ${{ inputs.platform }}
      build-type: ${{ inputs.build-type }}
      malloc-impl: ${{ inputs.malloc-impl }}
      compiler: ${{ inputs.compiler }}
      conan-channel: ${{ inputs.conan-channel }}
      tooling: None
    if: ${{ github.event_name != 'pull_request' }}

  HomeBlocksDeps:
    needs: [HomeStoreDeps, UblkppDeps]
    if: ${{ !cancelled() && (needs.HomeStoreDeps.result == 'success' || needs.HomeStoreDeps.result == 'skipped') && (needs.UblkppDeps.result == 'success' || needs.UblkppDeps.result == 'skipped') }}
    uses: ./.github/workflows/build_dependencies.yml
    with:
      branch: ${{ github.ref }}
      platform: ${{ inputs.platform }}
      build-type: ${{ inputs.build-type }}
      malloc-impl: ${{ inputs.malloc-impl }}
      compiler: ${{ inputs.compiler }}
      conan-channel: ${{ inputs.conan-channel }}
      tooling: ${{ inputs.tooling }}
      testing: 'True'
